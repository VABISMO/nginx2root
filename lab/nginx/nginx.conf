# nginx2root lab configuration (used by both the vulnerable and the patched
# container; the only difference between them is the image tag).
#
# Requirements for CVE-2026-123007: TLS + HTTP/2 enabled (`http2 on;`).

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # `http=$http2` in the log line lets you confirm h2 was negotiated.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" http=$http2';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        http2 on;

        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
