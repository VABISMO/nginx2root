name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & CLI smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --quiet ruff

      - name: Ruff
        run: ruff check tools/

      - name: Byte-compile
        run: python -m compileall -q tools

      - name: Self-test (pure logic, no network)
        run: cd tools && python selftest.py

      - name: CLI smoke tests
        run: |
          python tools/check_exposure.py --help
          python tools/check_exposure.py --version

  lab:
    name: Lab verification (vulnerable vs patched)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate lab certificates
        run: python tools/gen_certs.py

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start both targets
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Assert A/B behaviour
        run: python tools/verify_lab.py

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
